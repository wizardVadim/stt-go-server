version: '3.8'

services:
  stt-server:
    build:
      context: .
      dockerfile: ./stt-server/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - STT_LISTEN=0.0.0.0:8080
      
      - STT_DATA_DIR=/var/lib/stt
      - STT_DB_PATH=/var/lib/stt/jobs.sqlite
      
      - STT_MIGRATIONS_DIR=/opt/stt/migrations
      - STT_WEB_DIR=/opt/stt/web/dist
      
      - STT_FFPROBE=/usr/bin/ffprobe
      - STT_FFMPEG=/usr/bin/ffmpeg
      - STT_WHISPER=/opt/stt/whisper-cli
      - STT_MODEL=/opt/stt/models/ggml-large-v3-turbo.bin
      
      - STT_THREADS=4
      - STT_MAX_UPLOAD_BYTES=524288000
      - STT_MIN_FREE_BYTES=1073741824
      - STT_RETENTION=24h
      - STT_CLEANUP_INTERVAL=24h
      - STT_PROCESS_TIMEOUT=24h
    volumes:
      - ./data:/var/lib/stt
      - ./models:/opt/stt/models
    restart: always

  stt-frontend:
    build:
      context: ./web # Путь к папке фронтенда
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5174:5174" # Прокидываем порт для тестов Playwright
    volumes:
      - ./web:/app # Прокидываем код для работы Hot Reload (редактируете на хосте — меняется в контейнере)
      - /app/node_modules # Изолируем модули контейнера от локальных
    restart: always
